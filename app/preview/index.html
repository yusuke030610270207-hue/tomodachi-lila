<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: スマホ1画面。下のタブで ひろば・部活・トーク・わたし を切り替え、背景の淡い光が見ている人や場所の色に変わる */
  color-scheme: light;
  --ink:#4a4368;
  --ink-soft:#8a84a6;
  --paper:#fdfcff;
  --card:rgba(255,255,255,.84);
  --accent:#7f70d6;
  --accent-soft:#eeeafb;
  --line:rgba(127,112,214,.2);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#f1edfa;color:var(--ink);font-family:var(--font);font-weight:400;font-size:15px;line-height:1.7;letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none !important}

.phone{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}

/* 雰囲気の背景（淡め） */
.atmo{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;filter:blur(60px);opacity:.6;transition:background-color 2.6s ease, transform 1.2s ease;animation:drift 24s ease-in-out infinite alternate}
.blob:nth-child(1){left:-24%;top:-12%}
.blob:nth-child(2){right:-30%;top:16%;animation-duration:29s;animation-delay:-6s}
.blob:nth-child(3){left:-20%;bottom:6%;animation-duration:33s;animation-delay:-11s}
.blob:nth-child(4){right:-22%;bottom:-16%;animation-duration:27s;animation-delay:-3s}
.blob:nth-child(5){left:24%;top:36%;width:46%;opacity:.4;animation-duration:37s;animation-delay:-17s}
@keyframes drift{from{translate:0 0}to{translate:9% 7%}}
.atmo.pulse .blob{transform:scale(1.2)}

/* 上のバー */
.top{position:relative;display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 16px;background:rgba(253,252,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand-btn{display:flex;align-items:center;gap:8px;border-radius:12px}
.brand-word{font-family:"Parisienne","Snell Roundhand",cursive;font-size:30px;line-height:1;color:#6d5fc9;padding:4px 4px 0 0}
.page-title{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.page-title h1{font-size:19px;font-weight:500;line-height:1.35}
.page-title small{display:block;font-size:12.5px;color:var(--ink-soft)}
.view.chat .page-title{padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(253,252,255,.72)}
.hero{position:relative;flex:none;border-radius:26px;overflow:hidden;color:#fff;background:linear-gradient(160deg,#6a61c2 0%,#8d7bd6 52%,#d39fd6 100%);box-shadow:0 10px 28px rgba(106,97,194,.28)}
.hero-art{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:center;padding:22px 12px 20px;text-shadow:0 1px 8px rgba(60,40,140,.5)}
.hero-l1{font-size:13.5px;font-weight:500;letter-spacing:.55em;padding-left:.55em;line-height:1.4}
.hero-name{position:relative;font-family:"Parisienne","Snell Roundhand",cursive;font-size:84px;line-height:1.08;padding:0 6px}
.hero-name svg{position:absolute;right:-12px;top:6px}
.hero-l2{font-size:12.5px;font-weight:500;letter-spacing:.38em;padding-left:.38em;line-height:1.4}
.back{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px;line-height:1;flex:none}
.tag-demo{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--card);white-space:nowrap}

/* アイコン（色のリング） */
.ring{flex:none;width:44px;height:44px;border-radius:50%;padding:2.5px;display:block;transition:background 1.5s}
.ring>*{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:500;object-fit:cover;line-height:1}
.ring.small{width:34px;height:34px}.ring.small>*{font-size:14px}
.ring.big{width:104px;height:104px;padding:4px}.ring.big>*{font-size:44px}

/* 中身 */
.view{position:relative;flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.view.chat{overflow:hidden;padding:0;gap:0}
.card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:14px;box-shadow:0 4px 18px rgba(110,95,170,.08);display:flex;flex-direction:column;gap:10px;transition:box-shadow 1.2s}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:500;line-height:1.35}
.soft{color:var(--ink-soft);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{padding:4px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.5}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.tag{background:var(--accent-soft);border-color:transparent}
.chip.guess{border-color:var(--accent)}
.btn{padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.field{width:100%;min-width:0;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff}
.make{display:flex;gap:6px;flex-wrap:wrap}
.make .btn{flex:1;white-space:nowrap;padding-inline:8px;text-align:center}
.post-text{overflow-wrap:anywhere}
.post img{display:block;width:100%;border-radius:18px}
.post img.aura{width:68%;aspect-ratio:1}
.post img.stamp{width:44%;aspect-ratio:1}
.dots{display:flex;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;margin-left:-5px}
.dots i:first-child{margin-left:0}
.section-title{font-size:13px;color:var(--ink-soft);font-weight:500;padding:6px 2px 0}
.bar{display:flex;height:14px;border-radius:999px;background:#f0ecfa;overflow:hidden}
.bar i{display:block;height:100%;transition:width .8s}
.members{display:flex}.members .ring{margin-left:-8px;box-shadow:0 0 0 2px #fff}.members .ring:first-child{margin-left:0}
.wave{display:flex;align-items:center;gap:3px;height:34px;flex:1}
.wave i{flex:1;border-radius:999px;min-height:4px;transition:height .25s}
.play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;flex:none}
.profile-head{align-items:center;text-align:center;gap:8px;padding-top:18px;transition:background 1.2s}
.profile-head h2{font-size:20px;font-weight:500}
.swatches{display:flex;gap:8px;justify-content:center}
.swatches i,.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 6px rgba(110,95,170,.2);display:block}
button.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.swatch.slot{width:40px;height:40px}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icon-grid button{aspect-ratio:1;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:19px;line-height:1}
.list-item{display:flex;align-items:center;gap:12px;text-align:left;width:100%}

.app-icon{width:34px;height:34px;border-radius:9px;flex:none;display:block;box-shadow:0 2px 8px rgba(110,95,170,.2)}
.brand{flex-direction:row;align-items:center;gap:14px;padding:12px 16px}
.brand img{width:64px;height:64px;border-radius:15px;flex:none;box-shadow:0 4px 14px rgba(110,95,170,.22)}
.brand-text{display:inline-flex;flex-direction:column;align-items:stretch}
.brand-line{width:0;min-width:100%;display:flex;justify-content:space-between;white-space:nowrap;line-height:1.3;color:var(--ink-soft);font-weight:500}
.brand-name{position:relative;align-self:flex-start;font-family:"Parisienne","Snell Roundhand",cursive;font-size:54px;line-height:1.05;color:#6d5fc9;padding-right:2px}
.brand-name svg{position:absolute;right:-2px;top:-3px}
.preview-note{position:relative;z-index:2;flex:none;margin:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px;background:#6d5fc9;color:#fff;font-size:12px;line-height:1.5;text-align:center}
.preview-note a{color:#fff;font-weight:500;text-decoration:underline;white-space:nowrap}
/* 下のタブ */
.tabs{position:relative;display:flex;background:rgba(253,252,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px 10px}
.tabs button{flex:1;padding:8px 0 4px;font-size:13px;color:var(--ink-soft);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:500}
.tabs button[aria-current="page"]::before{background:var(--accent)}

/* トーク */
.log{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;max-width:78%;gap:2px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.bubble{padding:8px 14px;border-radius:20px;background:var(--card);box-shadow:0 2px 10px rgba(110,95,170,.07);overflow-wrap:anywhere}
.me .bubble{background:var(--accent-soft);border-bottom-right-radius:6px}
.them .bubble{border-bottom-left-radius:6px}
.msg img.aura{width:180px;max-width:100%;aspect-ratio:1;border-radius:24px;box-shadow:0 6px 22px rgba(110,95,170,.16);display:block}
.msg img.stamp{width:128px;max-width:100%;aspect-ratio:1;display:block}
.msg small{font-size:11px;color:var(--ink-soft);padding:0 6px}
.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.chat-composer{padding:10px 12px 12px;background:rgba(253,252,255,.86);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* シート */
.sheet{position:absolute;inset:0;z-index:5;background:var(--paper);display:none;flex-direction:column}
.sheet.open{display:flex;animation:rise .28s ease}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-top h2{flex:1;font-size:17px;font-weight:500;text-align:center}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;background:var(--accent-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:7px 6px;border-radius:11px;font-size:14px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 2px 8px rgba(110,95,170,.1)}
.pad-wrap{position:relative}
canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:24px}
#auraCanvas{box-shadow:0 8px 26px rgba(110,95,170,.14);aspect-ratio:1}
.overlay-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-soft);font-size:16px;transition:opacity .4s}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{aspect-ratio:1;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:20px;line-height:1}
.emoji-grid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent) inset}
.stamp-top{display:flex;gap:12px;align-items:flex-start}
.stamp-top .pad-wrap{flex:1;min-width:0}
#padCanvas{background:#fff;border:1.5px dashed var(--line);aspect-ratio:1}
.result{flex:none;width:36%;display:flex;flex-direction:column;gap:6px;align-items:center}
.result canvas{touch-action:auto;border-radius:20px;background:conic-gradient(#f5f2fc 25%,#fff 0 50%,#f5f2fc 0 75%,#fff 0) 0 0/16px 16px}
.opt h3{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--ink-soft)}
.count{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.blob,.pop,.sheet.open{animation:none}.blob{transition:background-color .2s}}
</style>
</head>
<body>
<div class="phone">
  <p class="preview-note">これから入る機能の見本です。書いた内容は保存されません。<a href="../">本物のリラへ</a></p>
  <div class="atmo" id="atmo" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <nav class="tabs" id="tabs" aria-label="メニュー">
    <button type="button" data-tab="home">ひろば</button>
    <button type="button" data-tab="clubs">部活</button>
    <button type="button" data-tab="talks">トーク</button>
    <button type="button" data-tab="me">わたし</button>
  </nav>

  <section class="sheet" id="auraSheet" aria-label="今日のイメージを作る">
    <div class="sheet-top">
      <button class="btn" type="button" data-close>とじる</button>
      <h2>今日のイメージ</h2>
      <button class="btn primary" type="button" id="sendAura">送る</button>
    </div>
    <div class="sheet-body">
      <div class="seg" role="group" aria-label="作り方">
        <button type="button" id="modeTrace" aria-pressed="true">なぞる</button>
        <button type="button" id="modeEmoji" aria-pressed="false">絵文字</button>
        <button type="button" id="modeVoice" aria-pressed="false">声</button>
      </div>
      <div class="pad-wrap">
        <canvas id="auraCanvas" width="600" height="600"></canvas>
        <div class="overlay-hint" id="traceHint">指でなぞってみてね</div>
      </div>
      <div id="tracePanel">
        <p class="soft">なぞる向きで色が、速さで光の大きさが変わります。</p>
        <div class="row" style="margin-top:8px"><button class="btn" type="button" id="clearTrace">やりなおす</button></div>
      </div>
      <div id="emojiPanel" hidden>
        <p class="soft" id="emojiHint">2〜3個えらぶと、組み合わせでオーラになります。</p>
        <div class="emoji-grid" id="emojiGrid" style="margin-top:8px"></div>
      </div>
      <div id="voicePanel" hidden>
        <p class="soft">「あー」と録った音声ファイルをえらぶと、声の高さが色に、大きさが光の大きさになります。</p>
        <div class="make" style="margin-top:8px">

<script id="core">
/* ===== 計算だけの部分（画面なしで動く） ===== */
const TAU = Math.PI * 2;
function bbox(pts){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const p of pts){if(p[0]<a)a=p[0];if(p[1]<b)b=p[1];if(p[0]>c)c=p[0];if(p[1]>d)d=p[1];}return {x0:a,y0:b,x1:c,y1:d,w:c-a,h:d-b,cx:(a+c)/2,cy:(b+d)/2};}
function normStrokes(strokes){
  const all=strokes.flat(); const bb=bbox(all); const s=Math.max(bb.w,bb.h)/2||1;
  return {strokes:strokes.map(st=>st.map(p=>[(p[0]-bb.cx)/s,(p[1]-bb.cy)/s])),aspect:(bb.w||1)/(bb.h||1)};
}
function polar(fn,n){const out=[];for(let i=0;i<n;i++){const t=i/n*TAU,r=fn(t);out.push([r*Math.cos(t),r*Math.sin(t)]);}return out;}
function chaikin(pts,closed,iters){
  let p=pts;
  for(let k=0;k<iters;k++){
    const q=[];const n=p.length;
    if(n<3)return p;
    if(!closed)q.push(p[0]);
    const end=closed?n:n-1;
    for(let i=0;i<end;i++){const a=p[i],b=p[(i+1)%n];q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);}
    if(!closed)q.push(p[n-1]);
    p=q;
  }
  return p;
}
function thin(pts,minD){const out=[pts[0]];for(const p of pts){const l=out[out.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>=minD)out.push(p);}if(out.length<2&&pts.length>1)out.push(pts[pts.length-1]);return out;}
function densify(pts,closed,step){
  const out=[];const n=pts.length;const end=closed?n:n-1;
  for(let i=0;i<end;i++){const a=pts[i],b=pts[(i+1)%n];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);const m=Math.max(1,Math.ceil(d/step));for(let j=0;j<m;j++)out.push([a[0]+(b[0]-a[0])*j/m,a[1]+(b[1]-a[1])*j/m]);}
  out.push(pts[closed?0:n-1]);return out;
}
const BINS=40;
function profile(strokes,closed){
  const prof=new Array(BINS).fill(-1);

  for(let i=0;i<BINS;i++){if(prof[i]<0){let v=0;for(let d=1;d<BINS;d++){const a=prof[(i+d)%BINS],b=prof[(i-d+BINS)%BINS];if(a>=0||b>=0){v=a>=0&&b>=0?(a+b)/2:Math.max(a,b);break;}}prof[i]=-2-v;}}
  return prof.map(v=>v<=-2?-(v+2):v);
}
function fit(poly){return normStrokes([poly]).strokes[0];}

/* 型（見本は8種類。本番は50〜100種類を想定） */
function makeMoon(){
  const c=[0.42,-0.1],R=0.82,out=[],inn=[];const a0=Math.atan2(c[1],c[0]);
  for(let i=0;i<=120;i++){const t=a0+i/120*TAU,x=Math.cos(t),y=Math.sin(t);if(Math.hypot(x-c[0],y-c[1])>R)out.push([x,y]);}

  return out.concat(inn.reverse());
}
function makeCloud(){
  const cs=[[-0.48,0.12,0.5],[0.48,0.12,0.5],[-0.05,-0.22,0.58],[0,0.2,0.5]];
  return polar(t=>{const dx=Math.cos(t),dy=Math.sin(t);let m=0;for(const [x,y,R] of cs){const b=dx*x+dy*y,disc=b*b-(x*x+y*y)+R*R;if(disc>=0)m=Math.max(m,b+Math.sqrt(disc));}return m;},160);

  {id:'heart',name:'ハート',poly:polar(()=>1,120).map((_,i)=>{const t=i/120*TAU;return [16*Math.pow(Math.sin(t),3),-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];}),fx:0,fy:-0.12,fs:.95},
  {id:'hoshi',name:'ほし',poly:chaikin(Array.from({length:10},(_,i)=>{const r=i%2?0.5:1,t=UP+i/10*TAU;return [r*Math.cos(t),r*Math.sin(t)];}),true,2),fx:0,fy:0.08,fs:.8},
  {id:'hana',name:'はな',poly:polar(t=>0.7+0.3*Math.cos(5*(t-UP)),160),fx:0,fy:0,fs:.62,detail:'center'},
  {id:'kumo',name:'くも',poly:makeCloud(),fx:0,fy:0.02,fs:.9},
  {id:'shizuku',name:'しずく',poly:polar(t=>0.66+0.55*Math.pow(Math.max(0,Math.cos(t-UP)),6),160),fx:0,fy:0.3,fs:.85},
  {id:'tsuki',name:'つき',poly:makeMoon(),fx:-0.5,fy:0.05,fs:.55},

/* 落書きがどの型に近いかを端末の中だけで判断する */
function recognize(strokes){
  if(!strokes.length||strokes.flat().length<4)return TEMPLATES.map(t=>({id:t.id,score:1}));
  const n=normStrokes(strokes);const prof=profile(n.strokes,false);
  return TEMPLATES.map(t=>{let s=0;for(let i=0;i<BINS;i++)s+=Math.abs(prof[i]-t.prof[i]);return {id:t.id,score:s/BINS+0.25*Math.abs(Math.log(n.aspect/t.aspect))};}).sort((a,b)=>a.score-b.score);
}

/* --- 色 --- */
function ringCss(hs){return `conic-gradient(${hsl(hs[0],78,78)},${hsl(hs[1],78,80)},${hsl(hs[2],78,82)},${hsl(hs[0],78,78)})`;}
function softBg(hs,l){return `linear-gradient(140deg,${hsl(hs[0],85,l,1,.35)},${hsl(hs[1],85,l,1,.35)},${hsl(hs[2],85,l,1,.35)})`;} // すきな3色のグラデーション
function setAtmo(hs,pulse){
  const b=$('atmo').children;for(let i=0;i<5;i++)b[i].style.backgroundColor=hsl(hs[i%hs.length],82,88,1,.35);
  if(pulse&&!reduced){$('atmo').classList.add('pulse');setTimeout(()=>$('atmo').classList.remove('pulse'),1200);}
}
function paintAtmo(pulse){
  const me=P.me.today||P.me.hues;
  if(nav.view==='profile')setAtmo(P[nav.id].hues,pulse);
  else if(nav.view==='club')setAtmo(CLUBS[nav.id].members.map(m=>P[m].hues[0]),pulse);
  else if(nav.view==='chat')setAtmo([me[0],P.macchi.hues[0],P.macchi.hues[1],me[1],me[2]],pulse);
  else setAtmo([me[0],P.me.hues[1],me[2],P.me.hues[0],me[1]],pulse);
}
function avatar(id,cls,click=true){
  const p=P[id];
  const inner=p.icon.t==='photo'?h('img',{src:p.icon.v,alt:''}):h('span',{text:p.icon.v,style:'background:'+softBg(p.hues,93)});
  return h(click?'button':'div',{class:'ring '+(cls||''),style:'background:'+ringCss(p.hues),type:click?'button':null,'aria-label':click?p.name+'のページをひらく':null,
    onclick:click?e=>{e.stopPropagation();go('profile',id);}:null},inner);
}

/* --- 画面の切り替え --- */
function go(view,id,root){
  if(root)nav.stack=[];else nav.stack.push({view:nav.view,id:nav.id});
  nav.view=view;nav.id=id||null;render();$('view').scrollTop=0;
}
function back(){const p=nav.stack.pop()||{view:'home',id:null};nav.view=p.view;nav.id=p.id;render();}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tab;if(t==='me')go('profile','me',true);else go(t,null,true);}));

<g transform="translate(358 26) scale(.82)"><polygon points="-10,6 10,6 26,70 -26,70" fill="url(#heroBeam)"/><path d="M-15,-2 A15,15 0 0 1 15,-2 Z" fill="#fff" opacity=".8"/><ellipse cx="0" cy="0" rx="34" ry="9.5" fill="#fff"/><ellipse cx="0" cy="3" rx="23" ry="4.5" fill="#e6dcfa"/><circle cx="-15" cy="2" r="1.9" fill="#fff3c4"/><circle cx="0" cy="4" r="1.9" fill="#fff3c4"/><circle cx="15" cy="2" r="1.9" fill="#fff3c4"/></g>

${[[338,96,6],[150,160,4.5],[96,44,4]].map(s=>`<path d="${starPath(s[0],s[1],s[2])}" fill="#fff3c4"/>`).join('')}

function hero(){
  return h('section',{class:'hero','aria-label':'高次元SNS リラ 声と色でつながる場所'},svgEl(HERO_SVG),
    h('div',{class:'hero-in','aria-hidden':'true'},
      h('div',{class:'hero-l1',text:'高次元SNSリラ'}),
      h('div',{class:'hero-name'},'Lila',svgEl('<svg viewBox="0 0 40 68" width="20" height="34"><path d="M20,2 Q21.44,31.44 38,34 Q21.44,36.56 20,66 Q18.56,36.56 2,34 Q18.56,31.44 20,2 Z" fill="#fff3c4"/></svg>')),
      h('div',{class:'hero-l2',text:'声と色でつながる場所'})));
}
function setTop(title,sub,opts={}){
  const top=$('top'),v=$('view');top.textContent='';
  if(nav.stack.length)top.append(h('button',{class:'back',type:'button','aria-label':'もどる',onclick:back,text:'‹'}));
  top.append(h('button',{class:'brand-btn',type:'button','aria-label':'リラ　ひろばへ',onclick:()=>go('home',null,true)},h('img',{class:'app-icon',src:APP_ICON,alt:''}),h('span',{class:'brand-word',text:'Lila'})));
  top.append(h('span',{class:'grow'}),h('span',{class:'tag-demo',text:'試作'}));
  if(nav.view!=='profile'||nav.id!=='me')top.append(avatar('me','small',true));
  if(opts.hero)v.append(hero());
  v.append(h('div',{class:'page-title'},opts.avatar?avatar(opts.avatar,'',true):null,h('div',{class:'grow'},h('h1',{text:title}),sub?h('small',{text:sub}):null)));
}
function render(){
  const v=$('view');v.textContent='';v.className='view';
  const tab=nav.view==='profile'&&nav.id==='me'&&!nav.stack.length?'me':nav.view==='club'?'clubs':nav.view==='chat'?'talks':nav.view;
  document.querySelectorAll('[data-tab]').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  ({home:viewHome,clubs:viewClubs,club:viewClub,talks:viewTalks,chat:viewChat,profile:viewProfile})[nav.view](v);
  paintAtmo(false);
}

/* --- 投稿 --- */
function addPost(p){posts.unshift({id:++pid,lights:[],...p});render();paintAtmo(true);}
function loadPhoto(file,cb,max=900){
  if(!file)return;const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85));};im.src=fr.result;};
  fr.readAsDataURL(file);
}
function composer(club){
  let tag=null;
  const input=h('input',{class:'field',type:'text',id:'postText-'+(club||'home'),placeholder:'いまの気持ち、やってみたいこと',autocomplete:'off','aria-label':'つぶやき'});
  const tags=['きもち','やってみたい'].map(t=>h('button',{type:'button',class:'chip','aria-pressed':'false',text:t,onclick:()=>{tag=tag===t?null:t;tags.forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===tag)));}}));
  const draft=()=>({who:'me',club:club||null,text:input.value.trim(),tag});
  const file=h('input',{type:'file',accept:'image/*',hidden:true,id:'photoIn-'+(club||'home'),'aria-label':'写真をえらぶ',onchange:()=>loadPhoto(file.files[0],url=>addPost({...draft(),kind:'photo',img:url}))});
  return h('form',{class:'card',onsubmit:e=>{e.preventDefault();const d=draft();if(!d.text){input.focus();return;}addPost({...d,kind:'text'});}},
    h('div',{class:'row'},avatar('me','small',false),h('div',{class:'grow'},input)),
    h('div',{class:'chips'},h('span',{class:'soft',text:'しるし'}),tags),
    h('div',{class:'make'},
      h('button',{type:'button',class:'btn',text:'今日のイメージ',onclick:()=>openAura({kind:'post',draft})}),
      h('button',{type:'button',class:'btn',text:'スタンプ',onclick:()=>openStamp({kind:'post',draft})}),
      h('button',{type:'button',class:'btn',text:'写真',onclick:()=>file.click()}),
      h('button',{type:'submit',class:'btn primary',text:'つぶやく'})),
    file);
}
function postCard(p){
  const who=P[p.who],mine=p.lights.includes('me');
  const glow=p.lights.length?`box-shadow:0 4px 18px rgba(110,95,170,.08),0 0 0 1.5px ${hsl(P[p.lights[p.lights.length-1]].hues[0],80,84)},0 0 26px ${hsl(P[p.lights[p.lights.length-1]].hues[0],85,80,.7)}`:'';
  return h('article',{class:'card post',style:glow},
    h('div',{class:'row'},avatar(p.who,'small'),
      h('div',{class:'grow'},h('div',{class:'name',text:who.name}),p.sample?h('div',{class:'soft',text:'見本の投稿'}):null),
      p.tag?h('span',{class:'chip tag',text:p.tag}):null),
    p.club?h('div',null,h('button',{type:'button',class:'chip',text:CLUBS[p.club].name,onclick:()=>go('club',p.club)})):null,
    p.text?h('p',{class:'post-text',text:p.text}):null,
    p.img?h('img',{class:p.kind,src:p.img,alt:p.kind==='aura'?'今日のイメージ':p.kind==='stamp'?'スタンプ':'写真'}):null,
    h('div',{class:'row'},
      h('button',{type:'button',class:'btn'+(mine?' primary':''),text:mine?'光をおくった':'光をおくる','aria-pressed':String(mine),
        onclick:()=>{if(mine)p.lights=p.lights.filter(x=>x!=='me');else p.lights.push('me');render();}}),
      h('div',{class:'dots','aria-label':p.lights.length+'人の光'},p.lights.map(l=>h('i',{style:'background:'+hsl(P[l].hues[0],80,78),title:P[l].name}))),
      p.lights.length?h('span',{class:'soft',text:p.lights.length+'人の色がとどいています'}):null));
}

/* --- ひろば --- */
function viewHome(v){
  setTop('ひろば','気持ちや、やってみたいことを置く場所',{hero:true});
  v.append(composer(null),...posts.map(postCard));

const UPDIR=-Math.PI/2;
const ac=$('auraCanvas'),actx=ac.getContext('2d');
let auraMode='trace',traceHues=[],traced=false,curHue=285,last=null,emojiSel=[],emojiRaf=0;
function star4(ctx,x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*0.28:r,t=UPDIR+i/8*TAU;ctx[i?'lineTo':'moveTo'](x+rr*Math.cos(t),y+rr*Math.sin(t));}ctx.closePath();}
function glowBlob(ctx,x,y,r,hh,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hsl(hh,88,78,a));g.addColorStop(1,hsl(hh,88,78,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}

function resetTrace(){wash(actx,600,600,P.me.hues);traceHues=[];traced=false;$('traceHint').textContent='指でなぞってみてね';$('traceHint').style.opacity=1;}
function canvasPos(c,e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];}
ac.addEventListener('pointerdown',e=>{if(auraMode!=='trace')return;ac.setPointerCapture(e.pointerId);last={p:canvasPos(ac,e),t:e.timeStamp};$('traceHint').style.opacity=0;});
ac.addEventListener('pointermove',e=>{

  const p=canvasPos(ac,e),dx=p[0]-last.p[0],dy=p[1]-last.p[1],d=Math.hypot(dx,dy);if(d<4)return;
  const speed=d/Math.max(1,e.timeStamp-last.t),tg=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
  curHue=(curHue+(((tg-curHue+540)%360)-180)*0.14+360)%360;   // 向き → 色
  const r=Math.min(120,34+speed*46),steps=Math.max(1,Math.round(d/14));   // 速さ → 光の大きさ
  for(let i=1;i<=steps;i++)glowBlob(actx,last.p[0]+dx*i/steps,last.p[1]+dy*i/steps,r,curHue,.17);
  if(Math.random()<.14){actx.fillStyle='rgba(255,255,255,.95)';star4(actx,p[0]+(Math.random()-.5)*r,p[1]+(Math.random()-.5)*r,4+Math.random()*9);actx.fill();}

function drawEmojiAura(ctx,W,H,sel,t){

}

let voice=null,voiceRaf=0,audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function analyzeVoice(data,sr){
  const k=Math.max(1,Math.floor(sr/11025)),n=Math.min(Math.floor(data.length/k),Math.floor(20*sr/k)),d=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<k;j++)s+=data[i*k+j];d[i]=s/k;}
  const r=sr/k,F=512,H=256,lo=Math.floor(r/600),hi=Math.ceil(r/85),frames=[],vals=new Float32Array(hi+1);let maxR=0;
  for(let o=0;o+F+hi<n;o+=H){
    let e=0,z=0;for(let i=0;i<F;i++){e+=d[o+i]*d[o+i];if(i&&(d[o+i]>=0)!==(d[o+i-1]>=0))z++;}
    const rms=Math.sqrt(e/F);let best=0,bl=0;

      for(let l=lo+1;l<hi;l++){if(vals[l]>=best*0.9&&vals[l]>=vals[l-1]&&vals[l]>=vals[l+1]){bl=l;break;}}}
    frames.push({rms,pitch:best>0.5&&bl?r/bl:0,bright:z/F});if(rms>maxR)maxR=rms;

function pitchHue(p){const t=Math.max(0,Math.min(1,Math.log(p/90)/Math.log(520/90)));return (250+t*170)%360;} // 低い声は青やすみれ、高い声はピンクやひだまり

  for(const f of a.frames){f.on=f.rms>0.12*a.maxR&&a.maxR>0.003;if(f.on&&f.pitch){lastHue=pitchHue(f.pitch);ps.push(f.pitch);}f.hue=f.on?lastHue:null;if(f.on&&lastHue!=null)hues.push(lastHue);}
  voice={...a,hues,buffer};
  if(!hues.length){$('voiceRead').textContent='声をうまく読みとれませんでした。もう少し長く、はっきり「あー」と録ったものでためしてね。';$('playVoice').hidden=true;wash(actx,600,600,P.me.hues);return;}
  ps.sort((x,y)=>x-y);const pal=pickPalette(hues);
  $('voiceRead').textContent=`声の高さ 約${Math.round(ps[ps.length>>1])}Hz　長さ ${a.dur.toFixed(1)}秒　この声は「${hueName(pal[1])}」`;
  $('playVoice').hidden=false;$('traceHint').style.opacity=0;paintVoice(true);
}
function paintVoice(animate){
  cancelAnimationFrame(voiceRaf);wash(actx,600,600,[voice.hues[0],voice.hues[voice.hues.length>>1],voice.hues[voice.hues.length-1]]);
  const fr=voice.frames,N=fr.length,stride=Math.max(1,Math.ceil(N/70));let i=0;const t0=performance.now();
  const step=now=>{
    const upTo=animate&&!reduced?Math.min(N,Math.ceil((now-t0)/2400*N)):N;
    for(;i<upTo;i++){const f=fr[i];if(i%stride||!f.on||f.hue==null)continue;
      const j=i/stride,a=j*0.62,rad=600*(0.03+0.4*i/N),x=300+Math.cos(a)*rad,y=300+Math.sin(a)*rad;
      glowBlob(actx,x,y,24+70*(f.rms/voice.maxR),f.hue,.3);            // 大きさ → 光の大きさ、高さ → 色
      if(j%2===0){actx.fillStyle='rgba(255,255,255,.95)';star4(actx,x+Math.sin(i*7.1)*30,y+Math.cos(i*5.3)*30,3+Math.min(12,f.bright*90));actx.fill();} // 響きの明るさ → きらめき
    }
    if(i<N)voiceRaf=requestAnimationFrame(step);
  };
  step(animate?t0:Infinity);
}

/* ================= スタンプ作成 ================= */
const pad=$('padCanvas'),pctx=pad.getContext('2d'),sc=$('stampCanvas');
const stamp={strokes:[],mode:'kata',kata:'neko',face:'niko',deco:'hane',border:'white',cands:[]};
const FACES=[['niko','にこ'],['pacchiri','ぱっちり'],['suya','すやすや'],['kira','きらきら'],['none','なし']];
const DECOS=[['hane','はね'],['kira','キラキラ'],['niji','にじ'],['wa','てんしのわ'],['none','なし']];
const BORDERS=[['white','白ふち'],['glow','ひかるふち'],['none','なし']];
function drawPad(){
  pctx.clearRect(0,0,500,500);pctx.lineCap='round';pctx.lineJoin='round';pctx.lineWidth=6;pctx.strokeStyle='#5a5080';
  for(const st of stamp.strokes){pctx.beginPath();st.forEach((p,i)=>pctx[i?'lineTo':'moveTo'](p[0],p[1]));if(st.length===1)pctx.lineTo(st[0][0]+.1,st[0][1]);pctx.stroke();}
}
let drawing=null;
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);drawing=[canvasPos(pad,e)];stamp.strokes.push(drawing);$('padHint').textContent='描き終わると、右にスタンプができます。';drawPad();});
pad.addEventListener('pointermove',e=>{if(!drawing)return;drawing.push(canvasPos(pad,e));drawPad();});
['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,()=>{if(!drawing)return;drawing=null;afterDraw();}));
$('undoPad').addEventListener('click',()=>{stamp.strokes.pop();drawPad();afterDraw();});
$('clearPad').addEventListener('click',()=>{stamp.strokes=[];drawPad();afterDraw();});
function afterDraw(){stamp.cands=recognize(stamp.strokes);if(stamp.strokes.length)stamp.kata=stamp.cands[0].id;renderChips();renderStamp();}
function tidyShapes(strokes){ // 線をなめらかにして、閉じた形は色で塗る
  if(!strokes.length)return {shapes:[],face:null};
  const n=normStrokes(strokes).strokes;let best=null;
  const shapes=n.filter(s=>s.length>1).map(s=>{
    const t=thin(s,0.03),bb=bbox(t),gap=Math.hypot(t[0][0]-t[t.length-1][0],t[0][1]-t[t.length-1][1]);
    const closed=t.length>6&&gap<0.3*Math.hypot(bb.w,bb.h);
    if(closed&&(!best||bb.w*bb.h>best.a))best={a:bb.w*bb.h,x:bb.cx,y:bb.cy,s:Math.min(bb.w,bb.h)/2};
    return {pts:chaikin(t,closed,3),closed};
  });
  return {shapes,face:best?{x:best.x,y:best.y+best.s*0.1,s:best.s}:null};
}
function drawFace(ctx,x,y,u,type,isCat,ink='#5a5080'){
  if(type==='none')return;ctx.save();ctx.strokeStyle=ink;ctx.lineCap='round';ctx.lineWidth=u*.26;
  const ex=u*1.55,ey=y-u*.35;
  ctx.fillStyle='rgba(255,140,165,.4)';for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(x+s*u*2.5,y+u*.55,u*.6,u*.4,0,0,TAU);ctx.fill();}
  ctx.fillStyle=ink;
  for(const s of[-1,1]){const cx=x+s*ex;
    if(type==='niko'){ctx.beginPath();ctx.arc(cx,ey+u*.2,u*.55,Math.PI*1.08,Math.PI*1.92);ctx.stroke();}
    else if(type==='suya'){ctx.beginPath();ctx.arc(cx,ey-u*.1,u*.55,Math.PI*.1,Math.PI*.9);ctx.stroke();}
    else if(type==='pacchiri'){ctx.beginPath();ctx.arc(cx,ey,u*.45,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-u*.14,ey-u*.16,u*.15,0,TAU);ctx.fill();ctx.fillStyle=ink;}
    else if(type==='kira'){star4(ctx,cx,ey,u*.75);ctx.fill();}}
  if(isCat){ctx.beginPath();ctx.moveTo(x-u*.28,y+u*.25);ctx.lineTo(x+u*.28,y+u*.25);ctx.lineTo(x,y+u*.6);ctx.closePath();ctx.fill();
    ctx.lineWidth=u*.15;for(const s of[-1,1])for(const k of[-.25,.25]){ctx.beginPath();ctx.moveTo(x+s*u*3.2,y+u*(.6+k));ctx.lineTo(x+s*u*4.5,y+u*(.6+k*2.4));ctx.stroke();}
    ctx.lineWidth=u*.22;ctx.beginPath();ctx.arc(x-u*.4,y+u*.6,u*.4,0,Math.PI*.9);ctx.stroke();ctx.beginPath();ctx.arc(x+u*.4,y+u*.6,u*.4,Math.PI*.1,Math.PI);ctx.stroke();}
  else if(type==='suya'){ctx.beginPath();ctx.arc(x,y+u*.75,u*.2,0,TAU);ctx.fill();}
  else if(type==='kira'){ctx.beginPath();ctx.arc(x,y+u*.5,u*.6,0,Math.PI);ctx.closePath();ctx.fill();}
  else{ctx.beginPath();ctx.arc(x,y+u*.35,u*.65,Math.PI*.18,Math.PI*.82);ctx.stroke();}
  ctx.restore();
}
function drawStamp(ctx,S,o){
  ctx.clearRect(0,0,S,S);
  const cx=S/2,cy=S*.54,R=S*.27,hs=o.hues;let shapes,face,tpl=null;
  if(o.mode==='kata'){tpl=TEMPLATES.find(t=>t.id===o.kata);shapes=[{pts:tpl.poly,closed:true}];face={x:tpl.fx,y:tpl.fy,s:tpl.fs};}
  else{const t=tidyShapes(o.strokes||[]);shapes=t.shapes;face=t.face;}
  if(!shapes.length)return;
  const paths=shapes.map(sh=>{const p=new Path2D();sh.pts.forEach((q,i)=>p[i?'lineTo':'moveTo'](cx+q[0]*R,cy+q[1]*R));if(sh.closed)p.closePath();return p;});
  ctx.lineJoin='round';ctx.lineCap='round';
  if(o.deco==='niji'){[350,25,50,140,200,270].forEach((x,i)=>{ctx.beginPath();ctx.strokeStyle=hsl(x,80,84);ctx.lineWidth=R*.1;ctx.arc(cx,cy+R*.35,R*(1.45-i*.095),Math.PI,TAU);ctx.stroke();});}
  if(o.deco==='hane'){for(const s of[-1,1]){ctx.save();ctx.translate(cx+s*R*.85,cy-R*.1);ctx.scale(s,1);ctx.fillStyle='#fff';ctx.shadowColor=hsl(hs[1],70,70,.5);ctx.shadowBlur=S*.035;
    [[.38,-.2,.52,.2,-.5],[.42,.04,.46,.17,-.15],[.34,.26,.36,.14,.2]].forEach(f=>{ctx.beginPath();ctx.ellipse(R*f[0],R*f[1],R*f[2],R*f[3],f[4],0,TAU);ctx.fill();});ctx.restore();}}
  if(o.border!=='none'){ctx.save();
    if(o.border==='white'){ctx.shadowColor='rgba(110,95,170,.26)';ctx.shadowBlur=S*.03;ctx.shadowOffsetY=S*.012;}else{ctx.shadowColor=hsl(hs[0],90,70);ctx.shadowBlur=S*.09;}
    ctx.strokeStyle='#fff';
    for(let k=0;k<(o.border==='glow'?2:1);k++)paths.forEach((p,i)=>{ctx.lineWidth=R*(shapes[i].closed?(o.border==='white'?.24:.12):(o.border==='white'?.36:.26));ctx.stroke(p);});
    ctx.restore();}
  const g=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,hsl(hs[0],82,83));g.addColorStop(.55,hsl(hs[1],82,82));g.addColorStop(1,hsl(hs[2],82,85)); // 淡い色で染める
  ctx.fillStyle=g;ctx.strokeStyle=g;
  paths.forEach((p,i)=>{if(shapes[i].closed)ctx.fill(p);else{ctx.lineWidth=R*.16;ctx.stroke(p);}});
  paths.forEach((p,i)=>{if(!shapes[i].closed)return;ctx.save();ctx.clip(p);const hg=ctx.createRadialGradient(cx-R*.35,cy-R*.5,0,cx-R*.35,cy-R*.5,R*.95);hg.addColorStop(0,'rgba(255,255,255,.6)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.fillRect(0,0,S,S);ctx.restore();});
  if(tpl&&tpl.detail==='center'){ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(cx,cy,R*.36,0,TAU);ctx.fill();}
  if(face)drawFace(ctx,cx+face.x*R,cy+face.y*R,R*.16*face.s,o.face,tpl&&tpl.id==='neko',toneOf(hs[1])===2?'#ffffff':'#5a5080');
  if(o.deco==='kira'){ctx.save();ctx.fillStyle='#fff';ctx.shadowColor=hsl(hs[0],90,68);ctx.shadowBlur=S*.035;
    [[-1.2,-.9,.24],[1.25,-.65,.17],[1.1,.95,.21],[-1.15,.75,.14],[.2,-1.35,.12]].forEach(k=>{star4(ctx,cx+k[0]*R,cy+k[1]*R,k[2]*R);ctx.fill();ctx.fill();});ctx.restore();}
  if(o.deco==='wa'){ctx.save();ctx.strokeStyle='#ffe08a';ctx.lineWidth=R*.09;ctx.shadowColor='#ffd766';ctx.shadowBlur=S*.04;ctx.beginPath();ctx.ellipse(cx,cy-R*1.22,R*.5,R*.14,0,0,TAU);ctx.stroke();ctx.restore();}
}
function stampOpts(){return {mode:stamp.mode,kata:stamp.kata,face:stamp.face,deco:stamp.deco,border:stamp.border,strokes:stamp.strokes,hues:P.me.hues};}
function renderStamp(){drawStamp(sc.getContext('2d'),360,stampOpts());}
function stampDataUrl(o){const c=document.createElement('canvas');c.width=c.height=360;drawStamp(c.getContext('2d'),360,o);return c.toDataURL('image/png');}
function chipRow(el,items,key){
  el.textContent='';
  items.forEach(([id,label,cls])=>el.append(h('button',{type:'button',class:'chip '+(cls||''),text:label,'aria-pressed':String(stamp[key]===id),onclick:()=>{stamp[key]=id;renderChips();renderStamp();}})));
}
function renderChips(){
  const order=stamp.cands.length?stamp.cands.map(c=>c.id):TEMPLATES.map(t=>t.id);
  chipRow($('kataChips'),order.map((id,i)=>[id,TEMPLATES.find(t=>t.id===id).name,i<3&&stamp.strokes.length?'guess':'']),'kata');
  chipRow($('faceChips'),FACES,'face');chipRow($('decoChips'),DECOS,'deco');chipRow($('borderChips'),BORDERS,'border');
  $('kataOpt').hidden=stamp.mode!=='kata';
  $('modeKata').setAttribute('aria-pressed',String(stamp.mode==='kata'));$('modeTidy').setAttribute('aria-pressed',String(stamp.mode==='tidy'));
  const per=FACES.length*DECOS.length*BORDERS.length;
  $('count').textContent=`型${TEMPLATES.length}種類 × かお${FACES.length} × かざり${DECOS.length} × ふち${BORDERS.length} ＝ ${TEMPLATES.length*per}通り。型が50種類になると${(50*per).toLocaleString()}通り。`;
}
$('modeKata').addEventListener('click',()=>{stamp.mode='kata';renderChips();renderStamp();});
$('modeTidy').addEventListener('click',()=>{stamp.mode='tidy';renderChips();renderStamp();});
function openStamp(t){target=t;$('stampSheet').classList.add('open');renderChips();renderStamp();}
$('sendStamp').addEventListener('click',()=>{
  if(stamp.mode==='tidy'&&!stamp.strokes.length){$('padHint').textContent='線を整えるには、まず左に描いてね。';return;}
  lastStamp=stampDataUrl(stampOpts());$('stampSheet').classList.remove('open');deliver('stamp',lastStamp,'わたしの色のスタンプ');
});

function asoScene(){
  const c=document.createElement('canvas');c.width=800;c.height=540;const x=c.getContext('2d');
  const sky=x.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#dfe6fb');sky.addColorStop(.5,'#f6e4f1');sky.addColorStop(.78,'#fdeedd');sky.addColorStop(1,'#fff6e6');x.fillStyle=sky;x.fillRect(0,0,800,540);
  const sun=x.createRadialGradient(560,300,0,560,300,220);sun.addColorStop(0,'rgba(255,244,214,1)');sun.addColorStop(.25,'rgba(255,226,190,.7)');sun.addColorStop(1,'rgba(255,226,190,0)');x.fillStyle=sun;x.fillRect(0,0,800,540);
  x.fillStyle='#c9c3e6';x.beginPath();x.moveTo(0,360);[[70,330],[150,300],[210,318],[290,262],[340,286],[400,250],[450,276],[520,236],[590,280],[660,300],[730,286],[800,318]].forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(800,540);x.lineTo(0,540);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<16;i++){x.beginPath();x.ellipse(i*56-10,372+Math.sin(i*1.7)*10,70,26+Math.cos(i)*6,0,0,TAU);x.fill();}
  x.fillStyle='#d5ead6';x.beginPath();x.moveTo(0,450);x.quadraticCurveTo(220,400,460,440);x.quadraticCurveTo(650,470,800,430);x.lineTo(800,540);x.lineTo(0,540);x.closePath();x.fill();
  return c.toDataURL('image/jpeg',.88);
}
