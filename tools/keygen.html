<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知の鍵を作る</title>
<style>
body{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;max-width:640px;margin:32px auto;padding:0 20px;color:#2a2347;background:#f6f1ff;line-height:1.7}
h1{font-size:22px}
button{font:inherit;font-weight:700;padding:12px 24px;border:0;border-radius:24px;background:#5b3fd0;color:#fff;cursor:pointer}
label{display:block;margin-top:20px;font-weight:700}
textarea{width:100%;box-sizing:border-box;font:14px ui-monospace,Menlo,monospace;padding:10px;border:1px solid #b9a4ff;border-radius:12px;background:#fff}
.note{font-size:14px;color:#5b5478}
</style>
</head>
<body>
<h1>通知の鍵を作る</h1>
<p class="note">この画面はあなたの端末の中だけで動きます。作った鍵はどこにも送られません。</p>
<button id="go" type="button">鍵を作る</button>

<label for="pub">公開鍵(config.js に貼る / Supabase の VAPID_PUBLIC_KEY にも貼る)</label>
<textarea id="pub" rows="3" readonly></textarea>

<label for="priv">秘密鍵(Supabase の VAPID_PRIVATE_KEY にだけ貼る。人に見せない)</label>
<textarea id="priv" rows="2" readonly></textarea>

<p class="note">もう一度押すと、別の鍵ができます。通知を使い始めたあとに作り直すと、全員がもう一度通知をオンにする必要があります。</p>

<script>
function b64u(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64u(str) {
  str = str.replace(/-/g, "+").replace(/_/g, "/");
  while (str.length % 4) str += "=";
  const bin = atob(str);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
document.getElementById("go").addEventListener("click", async () => {
  const kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
  const x = fromB64u(jwk.x);
  const y = fromB64u(jwk.y);
  const pub = new Uint8Array(65);
  pub[0] = 4;
  pub.set(x, 1);
  pub.set(y, 33);
  document.getElementById("pub").value = b64u(pub);
  document.getElementById("priv").value = jwk.d;
});
</script>
</body>
</html>
